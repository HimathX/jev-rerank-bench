[project]
name = "jev-rerank-bench"
version = "0.1.0"
description = "Reproducible NanoBEIR benchmark for Jev and local cross-encoder rerankers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.2,<5",
  "httpx>=0.27,<1",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "sentence-transformers>=3.3,<6",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_rank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

